name: dass

services:
  traefik-pki:
    image: alpine:3.20
    command:
      - sh
      - -c
      - apk add --no-cache openssl >/dev/null && sh /scripts/bootstrap-traefik-pki.sh /pki
    volumes:
      - ./infra/traefik:/scripts:ro
      - ./infra/traefik/pki:/pki
    restart: "no"
    networks:
      - dass-net
    labels:
      com.dass.project: dass
      com.dass.service: traefik-pki

  traefik:
    image: traefik:v3.1
    depends_on:
      traefik-pki:
        condition: service_completed_successfully
    command:
      - --api.dashboard=false
      - --providers.file.directory=/etc/traefik/dynamic
      - --providers.file.watch=true
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=:8443
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      - --log.level=INFO
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - ./infra/traefik/dynamic:/etc/traefik/dynamic:ro
      - ./infra/traefik/pki:/etc/traefik/pki:ro
    restart: unless-stopped
    networks:
      - dass-net
    labels:
      com.dass.project: dass
      com.dass.service: traefik

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: dass
      POSTGRES_USER: dass
      POSTGRES_PASSWORD: dass
    ports:
      - "5432:5432"
    volumes:
      - dass-postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init-primary:/docker-entrypoint-initdb.d
    # 100 connections is the ceiling every client has to fit under: the scheduler
    # connects directly, everything else is funnelled through pgbouncer.
    command: postgres -c max_connections=100 -c shared_buffers=256MB
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dass -d dass"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - dass-net
    labels:
      com.dass.project: dass
      com.dass.service: postgres

  postgres-replica:
    image: postgres:16-alpine
    # Replaces the official entrypoint: the replica bootstraps from the primary
    # with pg_basebackup instead of initdb.
    entrypoint: ["/init-script/entrypoint-replica.sh"]
    environment:
      POSTGRES_DB: dass
      POSTGRES_USER: dass
      POSTGRES_PASSWORD: dass
    volumes:
      - dass-replica-data:/var/lib/postgresql/data
      - ./infra/postgres/init-replica:/init-script
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - dass-net
    labels:
      com.dass.project: dass
      com.dass.service: postgres-replica
    
  pgbouncer:
    build:
      context: .
      dockerfile: Dockerfile.pgbouncer
    container_name: dass-pgbouncer
    # All configuration lives in pgbouncer.ini, which the image copies in and
    # starts from. Alpine's pgbouncer package ignores PGBOUNCER_*/DATABASE_URL
    # environment variables, so pool size and mode must be changed in that file.
    ports:
      - "6432:6432"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - dass-net

  localstack:
    image: localstack/localstack:3
    environment:
      SERVICES: sqs
      DEBUG: "0"
      PERSISTENCE: "1"
    ports:
      - "4566:4566"
    volumes:
      - ./infra/localstack/init:/etc/localstack/init/ready.d
      - dass-localstack-data:/var/lib/localstack
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:4566/_localstack/health | grep -qE '\"sqs\":\\s*\"(running|available)\"'"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped
    networks:
      - dass-net
    labels:
      com.dass.project: dass
      com.dass.service: localstack

  api-server:
    build:
      context: ./backend
      dockerfile: Dockerfile.api
    env_file:
      - .env
    environment:
      DASS_DATABASE_URL: ${DASS_DATABASE_URL:-postgresql+psycopg://dass:dass@pgbouncer:6432/dass}
      DASS_REPLICA_DATABASE_URL: ${DASS_REPLICA_DATABASE_URL:-postgresql+psycopg://dass:dass@postgres-replica:5432/dass}
      DASS_SQS_ENDPOINT_URL: ${DASS_SQS_ENDPOINT_URL:-http://localstack:4566}
      DASS_WORKER_ID: ${DASS_WORKER_ID:-api-server}
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8000/health >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy
      pgbouncer:
        condition: service_started
    restart: unless-stopped
    networks:
      - dass-net
    labels:
      com.dass.project: dass
      com.dass.service: api-server
      traefik.enable: "true"
      traefik.docker.network: dass-net
      traefik.http.routers.api.rule: (Host(`dass.localhost`) || Host(`127.0.0.1`)) && (PathPrefix(`/api`) || Path(`/health`) || Path(`/metrics`) || Path(`/docs`) || Path(`/redoc`) || Path(`/openapi.json`))
      traefik.http.routers.api.entrypoints: websecure
      traefik.http.routers.api.priority: "100"
      traefik.http.routers.api.service: api-server
      traefik.http.routers.api.tls: "true"
      traefik.http.services.api-server.loadbalancer.server.port: "8000"
      traefik.http.services.api-server.loadbalancer.healthcheck.path: /health
      traefik.http.services.api-server.loadbalancer.healthcheck.interval: 10s
      traefik.http.services.api-server.loadbalancer.healthcheck.timeout: 3s

  scheduler:
    build:
      context: ./backend
      dockerfile: Dockerfile.scheduler
    env_file:
      - .env
    environment:
      # The scheduler connects directly. Its leader election holds a session-level
      # advisory lock, and pgbouncer's transaction pooling would return the server
      # connection to the pool at commit and drop the lock with it.
      DASS_DATABASE_URL: ${DASS_DATABASE_URL:-postgresql+psycopg://dass:dass@postgres:5432/dass}
      DASS_REPLICA_DATABASE_URL: ${DASS_REPLICA_DATABASE_URL:-postgresql+psycopg://dass:dass@postgres-replica:5432/dass}
      DASS_SQS_ENDPOINT_URL: ${DASS_SQS_ENDPOINT_URL:-http://localstack:4566}
      DASS_WORKER_ID: ${DASS_WORKER_ID:-scheduler}
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy
      pgbouncer:
        condition: service_started
    restart: unless-stopped
    networks:
      - dass-net
    labels:
      com.dass.project: dass
      com.dass.service: scheduler

  autoscaler:
    build:
      context: ./backend
      dockerfile: Dockerfile.scheduler
    command: ["python", "-m", "app.cli", "autoscaler"]
    env_file:
      - .env
    environment:
      DASS_DATABASE_URL: ${DASS_DATABASE_URL:-postgresql+psycopg://dass:dass@pgbouncer:6432/dass}
      DASS_REPLICA_DATABASE_URL: ${DASS_REPLICA_DATABASE_URL:-postgresql+psycopg://dass:dass@postgres-replica:5432/dass}
      DASS_SQS_ENDPOINT_URL: ${DASS_SQS_ENDPOINT_URL:-http://localstack:4566}
      DASS_WORKER_ID: ${DASS_WORKER_ID:-autoscaler}
    # VMService starts sibling worker containers through the host Docker daemon.
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - dass-net
    labels:
      com.dass.project: dass
      com.dass.service: autoscaler

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    env_file:
      - .env
    environment:
      DASS_DATABASE_URL: ${DASS_DATABASE_URL:-postgresql+psycopg://dass:dass@pgbouncer:6432/dass}
      DASS_REPLICA_DATABASE_URL: ${DASS_REPLICA_DATABASE_URL:-postgresql+psycopg://dass:dass@postgres-replica:5432/dass}
      DASS_SQS_ENDPOINT_URL: ${DASS_SQS_ENDPOINT_URL:-http://localstack:4566}
      DASS_WORKER_ID: ${DASS_WORKER_ID:-worker}
      # Job containers join the compose network so they can reach api-server.
      # Derived from the pinned project name above: <project>_<network>.
      DASS_DOCKER_NETWORK: dass_dass-net
    # The worker starts job containers through the host Docker daemon.
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - dass-net
    labels:
      com.dass.project: dass
      com.dass.service: worker

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        DASS_BACKEND_URL: ${DASS_BACKEND_URL:-http://api-server:8000}
    depends_on:
      api-server:
        condition: service_started
    restart: unless-stopped
    networks:
      - dass-net
    labels:
      com.dass.project: dass
      com.dass.service: frontend
      traefik.enable: "true"
      traefik.docker.network: dass-net
      traefik.http.routers.frontend.rule: (Host(`dass.localhost`) || Host(`127.0.0.1`)) && PathPrefix(`/`)
      traefik.http.routers.frontend.entrypoints: websecure
      traefik.http.routers.frontend.priority: "1"
      traefik.http.routers.frontend.service: frontend
      traefik.http.routers.frontend.tls: "true"
      traefik.http.services.frontend.loadbalancer.server.port: "3000"
      traefik.http.services.frontend.loadbalancer.healthcheck.path: /
      traefik.http.services.frontend.loadbalancer.healthcheck.interval: 10s
      traefik.http.services.frontend.loadbalancer.healthcheck.timeout: 3s

volumes:
  dass-postgres-data:
  dass-replica-data:
  dass-localstack-data:

networks:
  dass-net:
    driver: bridge
