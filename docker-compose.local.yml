# Development overlay: mounts backend source for hot reload and publishes the
# ports the host needs. The frontend deliberately stays on its production build —
# Next.js dev mode inside a container needs more inotify watches than most hosts
# allow by default. Run `npm run dev` on the host for frontend hot reload.

services:
  api-server:
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend:/app
    environment:
      DASS_LOG_LEVEL: DEBUG
    ports:
      - "8000:8000"

  scheduler:
    command: python -m app.cli scheduler
    volumes:
      - ./backend:/app
    environment:
      DASS_LOG_LEVEL: DEBUG

  worker:
    command: python -m app.cli worker
    volumes:
      - ./backend:/app
    environment:
      DASS_LOG_LEVEL: DEBUG

  autoscaler:
    command: python -m app.cli autoscaler
    volumes:
      - ./backend:/app
    environment:
      DASS_LOG_LEVEL: DEBUG

  frontend:
    ports:
      - "3000:3000"
