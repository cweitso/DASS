apiVersion: v1
kind: ConfigMap
metadata:
  name: dass-config
  namespace: dass
data:
  # Point at Docker Compose postgres/localstack/pgbouncer on the host machine.
  # host.minikube.internal resolves to the bridge IP (192.168.49.1) from inside all pods.
  # api + worker 走 host 上的 pgbouncer(6432)做連線匯流：KEDA 會把 worker pod 擴到很多個,
  # 全部直連 Postgres 會超過 max_connections;pgbouncer 把伺服器連線收斂在固定數量。
  # 例外:scheduler 在 06-scheduler.yaml 覆寫成直連 5432(pg_advisory_lock 是 session 級鎖,
  # 走 pgbouncer transaction pooling 會失效)。
  DASS_DATABASE_URL: "postgresql+psycopg://dass:dass@host.minikube.internal:6432/dass"
  DASS_REPLICA_DATABASE_URL: "postgresql+psycopg://dass:dass@host.minikube.internal:5432/dass"
  DASS_SQS_ENDPOINT_URL: "http://host.minikube.internal:4566"
  DASS_QUEUE_BACKEND: "sqs"
  DASS_QUEUE_NAME_NORMAL: "dass-tasks-normal"
  DASS_QUEUE_NAME_SCHEDULED: "dass-tasks-scheduled"
  DASS_QUEUE_NAME_RETRY: "dass-tasks-retry"
  DASS_AWS_REGION: "us-east-1"
  DASS_AWS_ACCESS_KEY_ID: "dass"
  DASS_AWS_SECRET_ACCESS_KEY: "dass"
  DASS_LOG_LEVEL: "INFO"
  # Worker spawns job containers as K8s Jobs — KEDA handles replica scaling.
  DASS_EXECUTION_BACKEND: "kubernetes"
  DASS_K8S_NAMESPACE: "dass"
  DASS_K8S_POLL_INTERVAL_SECONDS: "2.0"
  DASS_WORKER_VISIBILITY_TIMEOUT_SECONDS: "30"
  DASS_SCHEDULER_INTERVAL_SECONDS: "5"
