apiVersion: v1
kind: ConfigMap
metadata:
  name: dass-config
  namespace: dass
data:
  # Every pod talks to the Docker Compose stack on the host machine.
  # host.minikube.internal resolves to the bridge IP (192.168.49.1) from inside pods.
  #
  # api + worker go through pgbouncer (6432): KEDA scales workers to many pods and
  # connecting each one straight to Postgres would blow past max_connections.
  # The scheduler overrides this to a direct 5432 connection in 06-scheduler.yaml,
  # because its leader election needs a session-level advisory lock.
  DASS_DATABASE_URL: "postgresql+psycopg://dass:dass@host.minikube.internal:6432/dass"
  # DASS_REPLICA_DATABASE_URL is intentionally unset. The Compose replica is not
  # reachable from the cluster, and pointing it at the primary would open a second
  # pool to the same server. Unset means reads reuse the primary engine.
  DASS_SQS_ENDPOINT_URL: "http://host.minikube.internal:4566"
  DASS_QUEUE_BACKEND: "sqs"
  DASS_QUEUE_NAME_NORMAL: "dass-tasks-normal"
  DASS_QUEUE_NAME_SCHEDULED: "dass-tasks-scheduled"
  DASS_QUEUE_NAME_RETRY: "dass-tasks-retry"
  DASS_AWS_REGION: "us-east-1"
  DASS_AWS_ACCESS_KEY_ID: "dass"
  DASS_AWS_SECRET_ACCESS_KEY: "dass"
  DASS_LOG_LEVEL: "INFO"
  # Workers submit each task as a Kubernetes Job; KEDA owns replica scaling.
  DASS_EXECUTION_BACKEND: "kubernetes"
  DASS_K8S_NAMESPACE: "dass"
  DASS_K8S_POLL_INTERVAL_SECONDS: "2.0"
  DASS_WORKER_VISIBILITY_TIMEOUT_SECONDS: "30"
  DASS_SCHEDULER_INTERVAL_SECONDS: "5"
