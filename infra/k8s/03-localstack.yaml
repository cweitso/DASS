apiVersion: v1
kind: ConfigMap
metadata:
  name: localstack-init
  namespace: dass
data:
  01-create-queues.sh: |
    #!/bin/sh
    set -eu
    awslocal sqs create-queue --queue-name dass-tasks          >/dev/null 2>&1 || true
    awslocal sqs create-queue --queue-name dass-tasks-normal   >/dev/null 2>&1 || true
    awslocal sqs create-queue --queue-name dass-tasks-scheduled >/dev/null 2>&1 || true
    awslocal sqs create-queue --queue-name dass-tasks-retry    >/dev/null 2>&1 || true
    echo "SQS queues ready."

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: localstack
  namespace: dass
  labels:
    app: localstack
spec:
  replicas: 1
  selector:
    matchLabels:
      app: localstack
  template:
    metadata:
      labels:
        app: localstack
    spec:
      containers:
      - name: localstack
        image: localstack/localstack:3
        env:
        - name: SERVICES
          value: sqs
        - name: DEBUG
          value: "0"
        - name: AWS_DEFAULT_REGION
          value: us-east-1
        - name: AWS_ACCESS_KEY_ID
          value: dass
        - name: AWS_SECRET_ACCESS_KEY
          value: dass
        ports:
        - containerPort: 4566
        readinessProbe:
          exec:
            command:
            - sh
            - -c
            - "curl -fs http://localhost:4566/_localstack/health | grep -qE '\"sqs\":\\s*\"(running|available)\"'"
          initialDelaySeconds: 10
          periodSeconds: 5
          failureThreshold: 12
        volumeMounts:
        - name: init-scripts
          mountPath: /etc/localstack/init/ready.d
        resources:
          requests:
            cpu: "100m"
            memory: "256Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
      volumes:
      - name: init-scripts
        configMap:
          name: localstack-init
          defaultMode: 0755

---
apiVersion: v1
kind: Service
metadata:
  name: localstack
  namespace: dass
spec:
  selector:
    app: localstack
  ports:
  - port: 4566
    targetPort: 4566
