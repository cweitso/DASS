apiVersion: apps/v1
kind: Deployment
metadata:
  name: dass-scheduler
  namespace: dass
  labels:
    app: dass-scheduler
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dass-scheduler
  template:
    metadata:
      labels:
        app: dass-scheduler
    spec:
      enableServiceLinks: false
      initContainers:
      - name: wait-for-postgres
        image: busybox:1.36
        command: ['sh', '-c', 'until nc -z postgres 5432; do echo waiting for postgres; sleep 2; done']
      - name: wait-for-localstack
        image: busybox:1.36
        command: ['sh', '-c', 'until nc -z localstack 4566; do echo waiting for localstack; sleep 2; done']
      containers:
      - name: scheduler
        image: dass-scheduler:local
        imagePullPolicy: Never
        command: ["python", "-m", "app.cli", "scheduler"]
        envFrom:
        - configMapRef:
            name: dass-config
        env:
        # 覆寫 configMap：scheduler 直連 Postgres(5432)。pg_advisory_lock 是 session 級鎖,
        # 不能走 pgbouncer transaction pooling(6432),否則 leader 選舉會壞。
        - name: DASS_DATABASE_URL
          value: "postgresql+psycopg://dass:dass@host.minikube.internal:5432/dass"
        # 明確標明身分,讓 db/session.py 的連線池配比走「保守額度」分支(而非預設 api-server)。
        - name: DASS_WORKER_ID
          value: "scheduler"
        resources:
          requests:
            cpu: "50m"
            memory: "128Mi"
          limits:
            cpu: "200m"
            memory: "256Mi"
