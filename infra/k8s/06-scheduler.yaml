apiVersion: apps/v1
kind: Deployment
metadata:
  name: dass-scheduler
  namespace: dass
  labels:
    app: dass-scheduler
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dass-scheduler
  template:
    metadata:
      labels:
        app: dass-scheduler
    spec:
      enableServiceLinks: false
      initContainers:
      - name: wait-for-postgres
        image: busybox:1.36
        command: ['sh', '-c', 'until nc -z host.minikube.internal 5432; do echo waiting for postgres; sleep 2; done']
      - name: wait-for-localstack
        image: busybox:1.36
        command: ['sh', '-c', 'until nc -z host.minikube.internal 4566; do echo waiting for localstack; sleep 2; done']
      containers:
      - name: scheduler
        image: dass-scheduler:local
        imagePullPolicy: Never
        command: ["python", "-m", "app.cli", "scheduler"]
        envFrom:
        - configMapRef:
            name: dass-config
        env:
        # Overrides the ConfigMap: the scheduler connects to Postgres directly.
        # Leader election holds a session-level advisory lock, which pgbouncer's
        # transaction pooling on 6432 would drop at commit.
        - name: DASS_DATABASE_URL
          value: "postgresql+psycopg://dass:dass@host.minikube.internal:5432/dass"
        # Named explicitly so the DB layer picks the small connection pool profile
        # instead of defaulting to the API server's.
        - name: DASS_WORKER_ID
          value: "scheduler"
        resources:
          requests:
            cpu: "50m"
            memory: "128Mi"
          limits:
            cpu: "200m"
            memory: "256Mi"
