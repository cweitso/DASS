apiVersion: apps/v1
kind: Deployment
metadata:
  name: dass-scheduler
  namespace: dass
  labels:
    app: dass-scheduler
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dass-scheduler
  template:
    metadata:
      labels:
        app: dass-scheduler
    spec:
      enableServiceLinks: false
      initContainers:
      - name: wait-for-postgres
        image: busybox:1.36
        command: ['sh', '-c', 'until nc -z postgres 5432; do echo waiting for postgres; sleep 2; done']
      - name: wait-for-localstack
        image: busybox:1.36
        command: ['sh', '-c', 'until nc -z localstack 4566; do echo waiting for localstack; sleep 2; done']
      containers:
      - name: scheduler
        image: dass-scheduler:local
        imagePullPolicy: Never
        command: ["python", "-m", "app.cli", "scheduler"]
        envFrom:
        - configMapRef:
            name: dass-config
        resources:
          requests:
            cpu: "50m"
            memory: "128Mi"
          limits:
            cpu: "200m"
            memory: "256Mi"
