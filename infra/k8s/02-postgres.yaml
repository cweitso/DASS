apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  namespace: dass
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 2Gi

---
# Init script: sets up replication user (mirrors infra/postgres/init-primary/00-setup-primary.sh).
# Kept minimal for local minikube — no streaming replica needed.
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  namespace: dass
data:
  00-setup-primary.sh: |
    #!/bin/bash
    set -e
    psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" <<-EOSQL
        DO \$\$
        BEGIN
          IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'replicator') THEN
            CREATE ROLE replicator WITH REPLICATION PASSWORD 'replicator_password' LOGIN;
          END IF;
        END
        \$\$;
    EOSQL

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: dass
  labels:
    app: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
      - name: postgres
        image: postgres:16-alpine
        env:
        - name: POSTGRES_DB
          value: dass
        - name: POSTGRES_USER
          value: dass
        - name: POSTGRES_PASSWORD
          value: dass
        ports:
        - containerPort: 5432
        readinessProbe:
          exec:
            command: ["pg_isready", "-U", "dass", "-d", "dass"]
          initialDelaySeconds: 5
          periodSeconds: 5
          failureThreshold: 10
        volumeMounts:
        - name: data
          mountPath: /var/lib/postgresql/data
        - name: init-scripts
          mountPath: /docker-entrypoint-initdb.d
        resources:
          requests:
            cpu: "100m"
            memory: "256Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: postgres-data
      - name: init-scripts
        configMap:
          name: postgres-init
          defaultMode: 0755

---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: dass
spec:
  selector:
    app: postgres
  ports:
  - port: 5432
    targetPort: 5432
