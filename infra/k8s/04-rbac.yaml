apiVersion: v1
kind: ServiceAccount
metadata:
  name: dass-worker
  namespace: dass

---
# Worker needs to create K8s Jobs (one per task execution) and read
# their Pod logs. Scoped to the dass namespace only.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: dass-worker-role
  namespace: dass
rules:
- apiGroups: ["batch"]
  resources: ["jobs"]
  verbs: ["create", "get", "list", "watch", "delete"]
- apiGroups: ["batch"]
  resources: ["jobs/status"]
  verbs: ["get"]
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["pods/log"]
  verbs: ["get"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: dass-worker-rolebinding
  namespace: dass
subjects:
- kind: ServiceAccount
  name: dass-worker
  namespace: dass
roleRef:
  kind: Role
  name: dass-worker-role
  apiGroup: rbac.authorization.k8s.io
