# Expose kube-state-metrics (installed by Helm in kube-system) as a NodePort
# so Docker Compose Prometheus can scrape it at 192.168.49.2:30091.
apiVersion: v1
kind: Service
metadata:
  name: kube-state-metrics-nodeport
  namespace: kube-system
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: kube-state-metrics
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30091
