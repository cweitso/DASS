# One ScaledObject per queue, each targeting its own Deployment.
# desired = ceil(queue_depth / 20), clamped to [1, 3].
#
# The ceiling is 3 rather than 10 because every worker pod also creates job pods:
# 3 queues x 3 workers x 2 concurrent tasks is already 18 job pods on a two-node
# minikube. Raise it alongside the node count, not on its own.

apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: dass-worker-normal
  namespace: dass
spec:
  scaleTargetRef:
    name: dass-worker-normal
  minReplicaCount: 1
  maxReplicaCount: 3
  cooldownPeriod: 60
  pollingInterval: 15
  triggers:
  - type: aws-sqs-queue
    authenticationRef:
      name: keda-aws-credentials
    metadata:
      queueURL: http://host.minikube.internal:4566/000000000000/dass-tasks-normal
      queueLength: "20"
      awsRegion: us-east-1
      awsEndpoint: http://host.minikube.internal:4566
      identityOwner: pod

