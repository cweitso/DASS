global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  - job_name: cadvisor
    static_configs:
      - targets: ['cadvisor:8080']

  - job_name: postgres
    static_configs:
      - targets: ['postgres-exporter:9187']

  - job_name: sqs
    static_configs:
      - targets: ['sqs-exporter:9100']

  # Mode 2 only: kube-state-metrics exposed via NodePort on Minikube node.
  # Target shows as "down" when Minikube isn't running — harmless.
  # Mode 2: kube-state-metrics forwarded to host via kubectl port-forward.
  # host.docker.internal resolves to the Docker bridge gateway (host IP).
  - job_name: kubernetes
    scrape_interval: 10s
    scrape_timeout: 8s
    static_configs:
      - targets: ['host.docker.internal:30091']
        labels:
          cluster: minikube
