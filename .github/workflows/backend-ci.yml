# Backend unit tests. SQLite + the in-memory queue, so no service containers are
# needed. Integration tests live in integration-ci.yml and run in parallel.
#
# One job runs the whole suite rather than one job per module. The suite takes a
# few seconds, a single `uv sync` is cheaper than seven, and a per-module split
# had already left three test files with no job at all.
name: Backend CI

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  workflow_dispatch:

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: backend

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
      - run: uv sync --all-extras --frozen
      - run: uv run pytest
