[databases]
dass = host=postgres port=5432 dbname=dass

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = plain
auth_file = /etc/pgbouncer/userlist.txt
pool_mode = transaction
max_client_conn = 1000
default_pool_size = 40
max_db_connections = 50
server_reset_query = DISCARD ALL
ignore_startup_parameters = extra_float_digits
# Run as a foreground container process: log to stderr (captured by `docker logs`)
# and skip the pidfile. Writing to /var/log/pgbouncer or /var/run/pgbouncer
# requires those dirs to be writable by the runtime UID, which was crash-looping
# the container with "Cannot open logfile: Permission denied". Empty values
# disable file logging / pidfile and remove that dependency entirely.
logfile =
pidfile =
